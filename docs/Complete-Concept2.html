function nav(page, extra={}) {
  S.page = page;
  if (extra.projectId !== undefined) S.projectId = extra.projectId;
  if (extra.tab) S.tab = extra.tab; else if (page.includes('detail')) S.tab = 'tasks';
  S.modal = null;
  render();
  setTimeout(() => {
    const el = document.getElementById('main-scroll');
    if (el) el.scrollTop = 0;
  }, 0);
}

function setTab(t) { S.tab = t; render(); }
function openModal(m) { S.modal = m; render(); }
function closeModal() { S.modal = null; render(); }

function showToast(msg, type='success') {
  S.toast = {msg, type};
  render();
  setTimeout(() => { S.toast = null; render(); }, 2500);
}

function handleLogin(e) {
  if (e) e.preventDefault();
  const email = document.getElementById('login-email')?.value || '';
  const pass  = document.getElementById('login-pass')?.value || '';
  const found = Object.values(USERS).find(u => u.email === email && u.pass === pass);
  if (found) {
    S.user = found;
    S.loginError = '';
    const rolePages = {Manager:'manager-dash', Designer:'designer-dash', Client:'client-dash'};
    nav(rolePages[found.role]);
  } else {
    S.loginError = 'Invalid email or password. Try password: pass';
    render();
  }
}

function loginAs(key) {
  S.user = USERS[key];
  S.loginError = '';
  const rolePages = {Manager:'manager-dash', Designer:'designer-dash', Client:'client-dash'};
  nav(rolePages[S.user.role]);
}

function logout() { S.user = null; S.page = 'login'; render(); }

function pct(a,b) { return b > 0 ? Math.min(Math.round(a/b*100), 100) : 0; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function progressBar(actual, budget, h='h-2') {
  const p = pct(actual, budget);
  const over = actual > budget;
  const color = over ? 'bg-red-500' : p > 80 ? 'bg-amber-500' : 'bg-blue-600';
  return `<div class="flex items-center gap-2.5">
    <div class="flex-1 ${h} bg-slate-100 rounded-full overflow-hidden">
      <div class="${color} h-full rounded-full" style="width:${clamp(p,0,100)}%"></div>
    </div>
    <span class="font-mono text-[11px] ${over?'text-red-500':'text-slate-500'} tabular-nums whitespace-nowrap">${actual} / ${budget} h${over?' ↑':''}</span>
  </div>`;
}

function designerName(key) {
  const u = USERS[key];
  return u ? u.name.split(' ')[0] + ' ' + u.name.split(' ')[1][0] + '.' : '—';

/* ═══════════════════════════════════════
   SHARED: TASKS TABLE
═══════════════════════════════════════ */
function tasksTable(projectId, showActions) {
  const tasks = TASKS[projectId] || [];
  if (!tasks.length) return `<div class="px-6 py-12 text-center text-slate-400 text-sm">No tasks yet.</div>`;

  const rows = tasks.map(t => {
    const variance = t.actualH > 0 ? (t.actualH - t.estimatedH) : null;
    const varStr = variance === null ? '—' : (variance > 0 ? `<span class="text-red-500">+${variance.toFixed(1)}</span>` : `<span class="text-emerald-500">${variance.toFixed(1)}</span>`);
    const icon = t.status === 'Completed'
      ? `<div class="w-4 h-4 rounded-full bg-slate-200 flex items-center justify-center shrink-0 mt-0.5"><svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1.5 4l2 2 3-3" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`
      : t.status === 'InProgress'
        ? `<div class="w-4 h-4 rounded-full border-2 border-blue-500 flex items-center justify-center shrink-0 mt-0.5"><div class="w-1.5 h-1.5 rounded-full bg-blue-500"></div></div>`
        : `<div class="w-4 h-4 rounded-full border-2 border-slate-300 shrink-0 mt-0.5"></div>`;

    const bg = t.status === 'Completed' ? 'bg-slate-50/30' : t.unplanned ? 'bg-amber-50/20' : '';
    const nameStyle = t.status === 'Completed' ? 'text-slate-400 line-through text-[13px]' : 'text-slate-800 font-medium text-[13px]';

    return `<tr class="hover:bg-slate-50/60 transition-colors group ${bg}">
      <td class="px-5 py-3">
        <div class="flex items-start gap-2.5">
          ${icon}
          <div>
            <p class="${nameStyle}">${t.name}</p>
            ${t.unplanned ? `<span class="inline-block mt-0.5 px-1.5 py-0.5 rounded text-[9px] bg-amber-100 text-amber-700 font-bold uppercase tracking-wide">Unplanned</span>` : ''}
          </div>
        </div>
      </td>
      <td class="px-4 py-3">${statusBadge(t.status)}</td>
      <td class="px-4 py-3">
        <div class="flex items-center gap-1.5">
          ${avatar(USERS[t.designerKey]?.initials||'?', USERS[t.designerKey]?.avatarColor||'bg-slate-400', 'w-5 h-5', 'text-[9px]')}
          <span class="text-[12px] text-slate-500">${designerName(t.designerKey)}</span>
        </div>
      </td>
      <td class="px-4 py-3 text-right font-mono text-[12px] text-slate-500 tabular-nums">${t.estimatedH > 0 ? t.estimatedH.toFixed(1) : '—'}</td>
      <td class="px-4 py-3 text-right font-mono text-[12px] text-slate-600 tabular-nums">${t.actualH > 0 ? t.actualH.toFixed(1) : '—'}</td>
      <td class="px-4 py-3 text-right font-mono text-[12px] tabular-nums">${varStr}</td>
      ${showActions ? `<td class="px-4 py-3 text-right">
        <div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1 justify-end">
          ${t.status !== 'Completed' ? `<button onclick="markTaskDone(${t.id})" class="text-[10px] text-emerald-600 hover:text-emerald-800 font-semibold px-2 py-1 rounded hover:bg-emerald-50">✓ Done</button>` : ''}
          <button class="text-[10px] text-slate-400 hover:text-slate-700 font-medium px-2 py-1 rounded hover:bg-slate-100">Edit</button>
        </div>
      </td>` : '<td></td>'}
    </tr>`;
  }).join('');

  const totEst = tasks.reduce((s, t) => s + t.estimatedH, 0);
  const totAct = tasks.reduce((s, t) => s + t.actualH, 0);
  const totUnplanned = tasks.filter(t => t.unplanned).length;

  return `
  <table class="w-full text-sm">
    <thead><tr class="bg-slate-50 border-b border-slate-200">
      <th class="text-left px-5 py-2.5 text-[10px] font-bold text-slate-500 uppercase tracking-widest w-[38%]">Task</th>
      <th class="text-left px-4 py-2.5 text-[10px] font-bold text-slate-500 uppercase tracking-widest w-[11%]">Status</th>
      <th class="text-left px-4 py-2.5 text-[10px] font-bold text-slate-500 uppercase tracking-widest w-[15%]">Designer</th>
      <th class="text-right px-4 py-2.5 text-[10px] font-bold text-slate-500 uppercase tracking-widest w-[10%]">Est. h</th>
      <th class="text-right px-4 py-2.5 text-[10px] font-bold text-slate-500 uppercase tracking-widest w-[10%]">Actual h</th>
      <th class="text-right px-4 py-2.5 text-[10px] font-bold text-slate-500 uppercase tracking-widest w-[9%]">Variance</th>
      <th class="w-[7%]"></th>
    </tr></thead>
    <tbody class="divide-y divide-slate-100">${rows}</tbody>
  </table>
  <div class="px-5 py-3 border-t border-slate-100 bg-slate-50/50 flex items-center justify-between">
    <p class="text-[11px] text-slate-400">${tasks.length} tasks · ${totUnplanned} unplanned</p>
    <div class="flex items-center gap-4 text-[11px]">
      <span class="text-slate-400">Total estimated <span class="font-mono font-semibold text-slate-700">${totEst.toFixed(1)} h</span></span>
      <span class="text-slate-200">|</span>
      <span class="text-slate-400">Total logged <span class="font-mono font-semibold text-slate-700">${totAct.toFixed(1)} h</span></span>
      <span class="text-slate-200">|</span>
      <span class="text-slate-400">Overrun <span class="font-mono font-semibold ${totAct > totEst ? 'text-red-500' : 'text-emerald-600'}">${totAct > totEst ? '+' : ''}${(totAct - totEst).toFixed(1)} h</span></span>
    </div>
  </div>`;
}

   SHARED: FEEDBACK TAB
═══════════════════════════════════════ */
function feedbackTab(projectId, canSubmit, canResolve) {
  const items = FEEDBACK[projectId] || [];
  const filtered = S.feedbackFilter === 'all' ? items : items.filter(f => f.status === S.feedbackFilter || f.cat === S.feedbackFilter);
  const pills = ['all','Pending','InProgress','Resolved','Revision','Approval','Question'];

  const filterRow = `<div class="px-5 py-3 border-b border-slate-100 flex items-center gap-2 flex-wrap">
    ${pills.map(p => `<button onclick="S.feedbackFilter='${p}';render()" class="px-2.5 py-1 rounded-full text-[11px] font-semibold transition-colors ${S.feedbackFilter===p?'bg-slate-800 text-white':'bg-slate-100 text-slate-500 hover:bg-slate-200'}">${p==='all'?'All':p==='InProgress'?'In Progress':p}</button>`).join('')}
    ${canSubmit ? `<button onclick="openModal('feedback')" class="ml-auto flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-700 text-white text-xs font-semibold hover:bg-blue-800 transition-colors"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M5.5 1v9M1 5.5h9" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>Submit Feedback</button>` : ''}
  </div>`;

  if (!filtered.length) return filterRow + `<div class="px-6 py-12 text-center text-slate-400 text-sm">No feedback matching filter.</div>`;

  const cards = filtered.map(f => {
    const resolveBtn = canResolve && f.status !== 'Resolved'
      ? `<button onclick="resolveFeedback(${f.id})" class="text-[11px] text-slate-500 hover:text-slate-800 font-medium px-2.5 py-1 rounded border border-slate-200 hover:bg-slate-50 transition-colors">Mark Resolved</button>` : '';
    return `<div class="px-5 py-4 border-b border-slate-100 last:border-0">
      <div class="flex items-start gap-3">
        <div class="flex-1">
          <div class="flex items-center gap-2 mb-2 flex-wrap">
            ${feedbackCatBadge(f.cat)}
            ${statusBadge(f.status === 'InProgress' ? 'InProgress-fb' : f.status)}
            <span class="text-[11px] text-slate-400 font-mono ml-auto">${f.date}</span>
          </div>
          <p class="text-[13px] text-slate-700 leading-relaxed">${f.content}</p>
          ${f.resolvedDate ? `<p class="text-[11px] text-slate-400 mt-1.5">Resolved ${f.resolvedDate}</p>` : ''}
        </div>
        ${resolveBtn ? `<div class="shrink-0 mt-1">${resolveBtn}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  return filterRow + cards;
}

function messagesTab(projectId) {
  const msgs = MESSAGES[projectId] || [];
  const bubbles = msgs.map(m => {
    const u = USERS[m.senderKey];
    const isMe = u?.key === S.user?.key;
    return `<div class="flex items-end gap-3 ${isMe ? 'flex-row-reverse' : ''}">
      ${avatar(u?.initials||'?', u?.avatarColor||'bg-slate-400', 'w-7 h-7', 'text-[10px]')}
      <div class="${isMe ? 'items-end' : 'items-start'} flex flex-col max-w-[70%]">
        <div class="flex items-center gap-2 mb-1 ${isMe ? 'flex-row-reverse' : ''}">
          <span class="text-[11px] font-semibold text-slate-700">${u?.name||'Unknown'}</span>
          <span class="text-[10px] text-slate-400">${u?.role}</span>
        </div>
        <div class="${isMe ? 'bg-blue-600 text-white rounded-2xl rounded-br-sm' : 'bg-slate-100 text-slate-800 rounded-2xl rounded-bl-sm'} px-4 py-2.5 text-[13px] leading-relaxed">
          ${m.content}
        </div>
        <span class="text-[10px] text-slate-400 mt-1">${m.time}</span>
      </div>
    </div>`;
  }).join('');

  return `<div class="p-5 space-y-4 min-h-48">${bubbles || '<p class="text-slate-400 text-sm text-center py-8">No messages yet.</p>'}</div>
  <div class="px-5 pb-5 border-t border-slate-100 pt-4">
    <div class="flex gap-3">
      <input id="msg-input" type="text" placeholder="Type a message…" class="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100" onkeydown="if(event.key==='Enter')sendMsg(${projectId})">
      <button onclick="sendMsg(${projectId})" class="px-4 py-2.5 bg-blue-700 text-white rounded-xl text-sm font-semibold hover:bg-blue-800 transition-colors">Send</button>
    </div>
  </div>`;
}

function sendMsg(projectId) {
  const input = document.getElementById('msg-input');
  if (!input || !input.value.trim()) return;
  if (!MESSAGES[projectId]) MESSAGES[projectId] = [];
  MESSAGES[projectId].push({
    id: Date.now(),
    senderKey: S.user.key,
    content: input.value.trim(),
    time: new Date().toLocaleString('en-GB', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).replace(',',''),
  });
  render();
  setTimeout(() => {
    const el = document.getElementById('msg-input');
    if (el) { el.value = ''; el.focus(); }
  }, 10);
}

/* ═══════════════════════════════════════

═══════════════════════════════════════ */
function budgetSection(p) {
  const pctUsed = pct(p.actualH, p.budgetH);
  const over = p.actualH > p.budgetH;
  const barColor = over ? 'bg-red-500' : pctUsed > 80 ? 'bg-amber-500' : 'bg-blue-600';
  const remaining = Math.max(0, p.budgetH - p.actualH);
  const targetRate = p.budgetAmt / p.budgetH;

  return `<div class="bg-white rounded-xl border border-slate-200 px-7 py-6 mb-6">
    <div class="flex items-center justify-between mb-5">
      <div>
        <h2 class="text-sm font-semibold text-slate-800">Budget Progress</h2>
        <p class="text-xs text-slate-400 mt-0.5">Hours consumed vs contracted budget</p>
      </div>
      <div class="flex items-center gap-6">
        ${[['Logged', p.actualH.toFixed(0)+' h','text-slate-900'], ['Budget', p.budgetH+' h','text-slate-900'], ['Remaining', remaining.toFixed(0)+' h', over?'text-red-500':'text-blue-700'], ['Contract', '$'+p.budgetAmt.toLocaleString(),'text-slate-900']].map(([l,v,c]) => `
          <div class="text-right">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${l}</p>
            <p class="font-mono text-lg font-semibold ${c} tabular-nums">${v}</p>
          </div>
        `).join('<div class="w-px h-10 bg-slate-200"></div>')}
      </div>
    </div>
    <div class="h-5 bg-slate-100 rounded-full overflow-hidden">
      <div class="${barColor} h-full rounded-full transition-all" style="width:${clamp(pctUsed,0,100)}%"></div>
    </div>
    <div class="flex items-center justify-between mt-1.5 text-[10px] font-mono text-slate-400">
      <span>0 h</span>
      <span class="${over?'text-red-600':'text-blue-700'} font-semibold">${p.actualH} h · ${pctUsed}%</span>
      <span>${p.budgetH} h</span>
    </div>
    <div class="flex items-center gap-5 mt-3 pt-3 border-t border-slate-100">
      <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-sm ${barColor}"></div><span class="text-xs text-slate-500">Logged — ${p.actualH} h</span></div>
      <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-sm bg-slate-100 ring-1 ring-slate-200"></div><span class="text-xs text-slate-500">Remaining — ${remaining} h</span></div>
      <div class="ml-auto text-xs text-slate-400">Target EHR: <span class="font-mono font-semibold text-slate-700">$${targetRate.toFixed(0)}</span> · Current EHR: <span class="font-mono font-semibold ${p.ehr >= targetRate?'text-emerald-600':'text-red-500'}">$${p.ehr}</span></div>
    </div>
  </div>`;
}

  return layout('manager-projects', 'Projects', `${PROJECTS.length} projects across ${new Set(PROJECTS.map(p=>p.client)).size} clients`, actions, content);

/* ═══════════════════════════════════════
   MANAGER — PROJECT DETAIL
═══════════════════════════════════════ */
function renderManagerProjectDetail() {
  const p = getProject(S.projectId);
  if (!p) return layout('manager-projects','Project not found','','',' ');

  const tasks = TASKS[p.id] || [];
  const msgs = MESSAGES[p.id] || [];
  const fbs = FEEDBACK[p.id] || [];
  const files = FILES[p.id] || [];
  const tls = TIMELOGS[p.id] || [];

  const breadcrumb = `<div class="flex items-center gap-1.5 text-[11px] text-slate-400 mb-2.5 font-medium">
    <button onclick="nav('manager-projects')" class="hover:text-blue-600 transition-colors">Projects</button>
    <span>/</span><span class="text-slate-600">${p.name}</span>
  </div>`;

  const metaChips = `<div class="flex items-center gap-2 mt-2 flex-wrap">
    ${statusBadge(p.status)}
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-600">📅 ${p.deadline}</span>
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-600">👤 ${p.client}</span>
    <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold ${p.catColor}">${p.cat}</span>
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-600">${p.designers.length} designer${p.designers.length>1?'s':''}</span>
  </div>`;

  const header = `${breadcrumb}<div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="font-display text-[28px] leading-tight text-slate-900">${p.name}</h1>
      ${metaChips}
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button onclick="openModal('assign-designer')" class="flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-50 transition-colors">+ Assign Designer</button>
      <button onclick="nav('manager-projects')" class="flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-50 transition-colors">← Back</button>
      <button onclick="showToast('Exporting PDF…')" class="flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-50 transition-colors">Export PDF</button>
    </div>
  </div>`;

  const kpiRow = `<div class="grid grid-cols-4 gap-4 mb-6">
    ${kpiCard('Budget Utilisation', pct(p.actualH,p.budgetH)+'%', `${p.actualH} of ${p.budgetH} h used`, 'bg-blue-600')}
    ${kpiCard('Eff. Hourly Rate', '$'+p.ehr, `Target $${Math.round(p.budgetAmt/p.budgetH)} · ${p.ehr >= p.budgetAmt/p.budgetH ? '+$'+(p.ehr - Math.round(p.budgetAmt/p.budgetH))+' above' : '-$'+(Math.round(p.budgetAmt/p.budgetH)-p.ehr)+' below'}`, p.ehr >= p.budgetAmt/p.budgetH ? 'bg-emerald-500' : 'bg-red-500')}
    ${kpiCard('Scope Creep Index', p.scopeCreep+'%', `${tasks.filter(t=>t.unplanned).length} of ${tasks.length} tasks unplanned`, p.scopeCreep > 20 ? 'bg-red-500' : p.scopeCreep > 10 ? 'bg-amber-400' : 'bg-emerald-500')}
    ${kpiCard('Rev : Approval Ratio', (p.revisions/Math.max(p.approvals,1)).toFixed(1)+' : 1', `${p.revisions} revisions · ${p.approvals} approvals`, p.revisions/Math.max(p.approvals,1) > 2 ? 'bg-red-500' : 'bg-slate-400')}
  </div>`;

  let tabContent = '';
  if (S.tab === 'tasks') {
    tabContent = `<div class="flex items-center justify-between px-5 py-3 border-b border-slate-100">
      <p class="text-xs text-slate-500">${tasks.length} tasks · ${tasks.filter(t=>t.status==='Completed').length} completed · ${tasks.filter(t=>t.status==='InProgress').length} in progress</p>
      <button onclick="openModal('add-task')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-700 text-white text-xs font-semibold hover:bg-blue-800 transition-colors">+ Add Task</button>
    </div>${tasksTable(p.id, true)}`;
  } else if (S.tab === 'timelogs') {
    tabContent = `<div class="flex items-center justify-between px-5 py-3 border-b border-slate-100">
      <p class="text-xs text-slate-500">${tls.length} entries logged</p>
      <button onclick="openModal('log-time')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-700 text-white text-xs font-semibold hover:bg-blue-800">+ Log Time</button>
    </div>${timelogsTab(p.id)}`;
  } else if (S.tab === 'feedback') {
    tabContent = feedbackTab(p.id, false, true);
  } else if (S.tab === 'messages') {
    tabContent = messagesTab(p.id);
  } else if (S.tab === 'files') {
    tabContent = filesTab(p.id, true);
  }

  const pendingFb = fbs.filter(f=>f.status!=='Resolved').length;
  const tabs = tabsHeader([
    ['tasks','Tasks', tasks.length],
    ['timelogs','Time Logs', tls.length],
    ['feedback','Feedback', pendingFb],
    ['messages','Messages', msgs.length],
    ['files','Files', files.length],
  ]);

  const content = `
    ${kpiRow}
    ${budgetSection(p)}
    ${[1,2,4].includes(p.id) ? aiNarrative(p.id) : ''}
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      ${tabs}
      ${tabContent}
    </div>`;

  return layout('manager-projects', p.name, p.description || p.client + ' · ' + p.cat,
    null, `${header}<div class="mt-6">${content}</div>`);
}

/* ═══════════════════════════════════════
   MANAGER — ANALYTICS
═══════════════════════════════════════ */
function renderManagerAnalytics() {
  const maxH = Math.max(...PROJECTS.map(p => Math.max(p.budgetH, p.actualH)));

  const barChart = PROJECTS.map(p => {
    const bPct = Math.round(p.budgetH / maxH * 100);
    const aPct = Math.round(p.actualH / maxH * 100);
    const over = p.actualH > p.budgetH;
    return `<div class="flex-1 flex flex-col items-center gap-1">
      <div class="flex gap-1 items-end h-32">
        <div class="w-6 bg-slate-200 rounded-t" style="height:${bPct}%;min-height:4px"></div>
        <div class="w-6 ${over?'bg-red-400':'bg-blue-500'} rounded-t" style="height:${aPct}%;min-height:4px"></div>
      </div>
      <p class="text-[9px] text-slate-400 text-center max-w-[56px] leading-tight">${p.name.split(' ').slice(0,2).join(' ')}</p>
    </div>`;
  }).join('');

  const ehrBars = [...PROJECTS].sort((a,b) => b.ehr - a.ehr).map(p => {
    const maxEhr = 700;
    const pctW = Math.round(p.ehr / maxEhr * 100);
    const color = p.ehr >= 300 ? 'bg-emerald-500' : p.ehr >= 180 ? 'bg-blue-500' : 'bg-red-400';
    return `<div class="flex items-center gap-3 mb-2">
      <span class="text-[12px] text-slate-600 w-36 text-right truncate">${p.name.split(' ').slice(0,2).join(' ')}</span>
      <div class="flex-1 h-5 bg-slate-100 rounded-full overflow-hidden">
        <div class="${color} h-full rounded-full" style="width:${pctW}%"></div>
      </div>
      <span class="font-mono text-[12px] font-semibold text-slate-800 w-14 tabular-nums">$${p.ehr}</span>
    </div>`;
  }).join('');

  const clientProfRows = [
    {name:'Vantage Capital', revenue:70000, hours:44, ehr:500, revRatio:0.4, color:'text-emerald-700'},
    {name:'Meridian Tech', revenue:9000, hours:14, ehr:643, revRatio:1.0, color:'text-emerald-700'},
    {name:'Harpers & Co', revenue:21280, hours:89, ehr:214, revRatio:2.3, color:'text-slate-800'},
    {name:'MoverPro Ltd', revenue:25600, hours:107, ehr:189, revRatio:2.5, color:'text-amber-700'},
    {name:'Arkwright Films', revenue:20800, hours:72, ehr:208, revRatio:1.3, color:'text-slate-800'},
    {name:'ZenPath Wellness', revenue:8250, hours:62, ehr:132, revRatio:0.9, color:'text-red-600'},

  const content = `

      <div class="bg-white rounded-xl border border-slate-200 p-6">
        <h2 class="text-sm font-semibold text-slate-800 mb-1">Budget vs Actual Hours</h2>
        <p class="text-xs text-slate-400 mb-5">Per project · estimated (light) vs logged (dark)</p>
        <div class="flex items-end gap-3 h-36 mb-3">
          ${barChart}
        </div>
        <div class="flex items-center gap-4 text-xs text-slate-500">
          <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded-sm bg-slate-200"></div>Budget h</div>
          <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded-sm bg-blue-500"></div>Actual h</div>
          <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded-sm bg-red-400"></div>Over budget</div>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-6">
        <h2 class="text-sm font-semibold text-slate-800 mb-1">Effective Hourly Rate by Project</h2>
        <p class="text-xs text-slate-400 mb-5">budget_amount ÷ hours_logged · target $150–300</p>
        <div class="pt-1">
          ${ehrBars}
        </div>
        <div class="flex items-center gap-4 mt-4 text-xs text-slate-500">
          <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded-sm bg-emerald-500"></div>Above $300</div>
          <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded-sm bg-blue-500"></div>$180–$300</div>
          <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded-sm bg-red-400"></div>Below $180</div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-6">
      <div class="col-span-2 bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-200">
          <h2 class="text-sm font-semibold text-slate-800">Client Profitability Ranking</h2>
          <p class="text-xs text-slate-400 mt-0.5">Ranked by total revenue · EHR and revision ratio shown</p>
        </div>
        <table class="w-full text-sm">
          <thead><tr class="bg-slate-50 border-b border-slate-200">

            <th class="text-left px-4 py-2.5 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Client</th>
            <th class="text-right px-4 py-2.5 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Revenue</th>

/* ═══════════════════════════════════════
   MODALS
═══════════════════════════════════════ */
function markTaskDone(taskId) {
  for (const key in TASKS) {
    const t = TASKS[key].find(x => x.id === taskId);
    if (t) { t.status = 'Completed'; break; }
  }
  showToast('Task marked as completed');
}

function resolveFeedback(fbId) {
  for (const key in FEEDBACK) {
    const f = FEEDBACK[key].find(x => x.id === fbId);
    if (f) { f.status = 'Resolved'; f.resolvedDate = new Date().toISOString().split('T')[0]; break; }
  }
  showToast('Feedback marked as resolved');
}

function submitFeedback(e) {
  e.preventDefault();
  const cat = document.getElementById('fb-cat')?.value;
  const content = document.getElementById('fb-content')?.value;
  if (!content?.trim()) return;
  if (!FEEDBACK[S.projectId]) FEEDBACK[S.projectId] = [];
  FEEDBACK[S.projectId].push({
    id: Date.now(), cat, status: 'Pending', content: content.trim(),
    date: new Date().toISOString().split('T')[0], resolvedDate: null, clientKey: S.user.key,
  });
  S.modal = null;
  showToast('Feedback submitted successfully');
}

function addTask(e) {
  e.preventDefault();
  const name = document.getElementById('task-name')?.value;
  const hours = parseFloat(document.getElementById('task-hours')?.value || '0');
  if (!name?.trim()) return;
  if (!TASKS[S.projectId]) TASKS[S.projectId] = [];
  TASKS[S.projectId].push({
    id: Date.now(), name: name.trim(), status: 'Todo',
    designerKey: S.user.role === 'Designer' ? S.user.key : 'designer_sr',
    estimatedH: hours, actualH: 0, unplanned: false, desc: '',
  });
  S.modal = null;
  showToast('Task added successfully');
}

function logTime(e) {
  e.preventDefault();
  const task = document.getElementById('log-task')?.value;
  const hours = parseFloat(document.getElementById('log-hours')?.value || '0');
  const desc = document.getElementById('log-desc')?.value || '';
  if (!hours) return;
  if (!TIMELOGS[S.projectId]) TIMELOGS[S.projectId] = [];
  TIMELOGS[S.projectId].push({
    id: Date.now(), task: task || 'General', designerKey: S.user.key,
    hours, desc, date: new Date().toISOString().split('T')[0],
  });
  const proj = getProject(S.projectId);
  if (proj) proj.actualH = parseFloat((proj.actualH + hours).toFixed(1));
  S.modal = null;
  showToast(`${hours}h logged successfully`);
}

              ${avatar(d.initials, d.color, 'w-9 h-9', 'text-sm')}
              <div>
                <p class="text-[13px] font-semibold text-slate-800">${d.name}</p>
                <p class="text-[11px] text-slate-400">${d.spec} · $${d.rate}/h · ${Math.round(d.logged/d.avail*100)}% utilised</p>
              </div>
            </div>
            ${assigned
              ? `<span class="text-[11px] text-blue-600 font-semibold">Assigned ✓</span>`
              : `<button onclick="assignDesigner('${d.key}')" class="text-[11px] font-semibold text-white bg-blue-700 hover:bg-blue-800 px-2.5 py-1 rounded-lg transition-colors">Assign</button>`}
          </div>`;
        }).join('')}
        <div class="pt-3"><button onclick="closeModal()" class="w-full py-2.5 border border-slate-200 text-slate-600 rounded-lg text-sm font-semibold hover:bg-slate-50">Close</button></div>
      </div>`,
    },
    'invite-user': {
      title: 'Invite User',
      body: `<form onsubmit="event.preventDefault();showToast('Invitation sent!');closeModal()" class="space-y-4">
        <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Full name</label>
          <input type="text" placeholder="Jane Smith" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400"></div>
        <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Email address</label>
          <input type="email" placeholder="jane@agency.io" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400"></div>
        <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Role</label>
          <select class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none">
            <option>Designer</option><option>Client</option><option>Manager</option>
          </select></div>
        <p class="text-xs text-slate-400">An invitation email with a 48h activation link will be sent automatically.</p>
        <div class="flex items-center gap-3 pt-2">
          <button type="submit" class="flex-1 py-2.5 bg-blue-700 text-white rounded-lg text-sm font-semibold hover:bg-blue-800">Send Invitation</button>
          <button type="button" onclick="closeModal()" class="flex-1 py-2.5 border border-slate-200 text-slate-600 rounded-lg text-sm font-semibold hover:bg-slate-50">Cancel</button>
        </div>
      </form>`,
    },
    'new-project': {
      title: 'New Project',
      body: `<form onsubmit="event.preventDefault();showToast('Project created!');closeModal()" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div class="col-span-2"><label class="block text-xs font-semibold text-slate-600 mb-1.5">Project name</label>
            <input type="text" placeholder="e.g. Luminos Rebrand 2025" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400"></div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Client</label>
            <select class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none">
              ${Object.values(USERS).filter(u=>u.role==='Client').map(u=>`<option>${u.company||u.name}</option>`).join('')}
            </select></div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Category</label>
            <select class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none">
              <option>Branding</option><option>UI / UX</option><option>Editorial</option><option>Web Design</option><option>Packaging</option><option>Motion</option>
            </select></div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Budget hours</label>
            <input type="number" min="0" step="5" placeholder="80" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none"></div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Contract value ($)</label>
            <input type="number" min="0" placeholder="12000" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none"></div>
          <div class="col-span-2"><label class="block text-xs font-semibold text-slate-600 mb-1.5">Deadline</label>
            <input type="date" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none"></div>
        </div>
        <div class="flex items-center gap-3 pt-2">
          <button type="submit" class="flex-1 py-2.5 bg-blue-700 text-white rounded-lg text-sm font-semibold hover:bg-blue-800">Create Project</button>
          <button type="button" onclick="closeModal()" class="flex-1 py-2.5 border border-slate-200 text-slate-600 rounded-lg text-sm font-semibold hover:bg-slate-50">Cancel</button>
        </div>
      </form>`,
    },
  };

  const m = modals[S.modal];
  if (!m) return '';

  return `<div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4" onclick="if(event.target===this)closeModal()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
        <h2 class="text-base font-semibold text-slate-900">${m.title}</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 transition-colors">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="px-6 py-5">${m.body}</div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
function renderToast() {
  if (!S.toast) return '';
  const isErr = S.toast.type === 'error';
  const bg = isErr ? 'bg-red-600' : 'bg-slate-900';
  return `<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] ${bg} text-white px-5 py-3 rounded-xl text-sm font-medium shadow-lg flex items-center gap-2.5 pointer-events-none">
    ${isErr
      ? `<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="white" stroke-width="1.4"/><path d="M7.5 4.5v3.5M7.5 10h.01" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>`
      : `<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M3 7.5l3.5 3.5 5.5-6" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
    ${S.toast.msg}
  </div>`;
}

/* ═══════════════════════════════════════
   RENDER
═══════════════════════════════════════ */
function assignDesigner(key) {
  const p = getProject(S.projectId);
  if (p && !p.designers.includes(key)) p.designers.push(key);
  showToast('Designer assigned');
}

function render() {
  const pageMap = {
  'login':             renderLogin,
  'manager-dash':      renderManagerDash,
  'manager-projects':  renderManagerProjects,
  'manager-project-detail': renderManagerProjectDetail,
  'manager-analytics': renderManagerAnalytics,
  'manager-reports':   renderManagerReports,
  'manager-team':      renderManagerTeam,
  'manager-settings':  renderSettings,
  'designer-dash':     renderDesignerDash,
  'designer-projects': renderDesignerProjects,
  'designer-project-detail':   renderDesignerProjectDetail,
  'designer-settings': renderSettings,
  'client-dash':       renderClientDash,
  'client-projects':   renderClientProjects,
  'client-project-detail':     renderClientProjectDetail,
  'client-settings':   renderSettings,
};

  const fn = pageMap[S.page];
  const html = fn ? fn() : `<div class="p-8 text-slate-400">Page not found: ${S.page}</div>`;
  document.getElementById('app').innerHTML = html + renderModal() + renderToast();
}

/* ── Bootstrap ───────────────────────────────────────────────────────────── */
render();
</script>
</body>
</html>
